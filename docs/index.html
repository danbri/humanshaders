<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>HumanShaders Web</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #app {
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    #loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      color: #fff;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }
    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #loading h1 {
      font-size: 24px;
      font-weight: 300;
      margin-bottom: 20px;
    }
    #loading .progress {
      width: 200px;
      height: 2px;
      background: #333;
      border-radius: 1px;
      overflow: hidden;
    }
    #loading .progress-bar {
      height: 100%;
      background: #fff;
      width: 0%;
      transition: width 0.3s ease;
    }
    #info {
      position: fixed;
      bottom: 20px;
      left: 20px;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
    }
  </style>
  <script type="module" crossorigin src="/humanshaders/assets/index-CnveaM-8.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="loading">
    <h1>HumanShaders</h1>
    <div class="progress">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
  </div>
  <div id="info">Drag to rotate | Scroll to zoom</div>
</body>
</html>
